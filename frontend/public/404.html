<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Boda Fátima & Mario</title>
  </head>
  <body>
    <script>
      // SPA redirect for GitHub Pages (project sites)
      // Based on https://github.com/rafgraph/spa-github-pages
      (function () {
        var l = window.location;
        var repoBase = '/web-boda';
        var path = l.pathname;

        if (path.indexOf(repoBase) !== 0) {
          repoBase = '';
        }

        var redirect = repoBase + '/?/' + path.replace(repoBase + '/', '') + l.search + l.hash;
        l.replace(redirect);
      })();
    </script>
  </body>
</html>
