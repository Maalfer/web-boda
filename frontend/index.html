<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%heart.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boda Fátima & Mario</title>
  
  <!-- Performance optimizations -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://maps.googleapis.com" />
  <link rel="preconnect" href="https://maps.gstatic.com" />
  
  <!-- Font loading optimization -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Lovely+Girl:wght@400;700&family=Griffiths+by+Eurostyle&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lovely+Girl:wght@400;700&family=Griffiths+by+Eurostyle&display=swap"></noscript>
  
  <!-- Critical CSS inline -->
  <style>
    /* Prevent flash of unstyled content */
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
    }
    
    /* Loading skeleton */
    #root {
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f5f5 0%, #e8e8e8 100%);
    }
  </style>
</head>

<body>
  <script>
    // SPA redirect for GitHub Pages (project sites)
    // Based on https://github.com/rafgraph/spa-github-pages
    (function (l) {
      if (l.search && l.search.startsWith('?/')) {
        var route = l.search.slice(2);
        var decoded = route.replace(/~and~/g, '&');
        window.history.replaceState(null, '', l.pathname + decoded + l.hash);
      }
    })(window.location);
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
